name: chronoplan_time_management
description: "Connected Flutter Time Management & Planning Application with Real REST API, JWT Auth & Hive Caching."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1
  
  # Networking & REST API
  dio: ^5.4.1
  
  # Local Storage & Caching (Hive NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network Connectivity (Online / Offline detection)
  connectivity_plus: ^5.0.2
  
  # Navigation
  go_router: ^14.8.1
  
  # Typography & Design
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
